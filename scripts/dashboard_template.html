<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robi Live Site · On Air Year dashboard __VERSION__</title>
<style>
  :root {
    --navy: #1F4E79;
    --teal: #156082;
    --ink: #1a1a1a;
    --muted: #595959;
    --line: #d9d9d9;
    --paper: #f4f6f8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: Calibri, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
  }
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 8px 14px;
    background: var(--navy);
    color: #fff;
  }
  .topbar h1 { margin: 0; font-size: 17px; }
  .topbar span { font-size: 12px; opacity: .85; }
  aside {
    grid-row: 2;
    background: #fff;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .tools { padding: 8px 8px 6px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); }
  .tools label { font-size: 11px; font-weight: 700; color: var(--navy); margin-top: 2px; }
  select, input[type="search"] {
    width: 100%;
    border: 1px solid #b0b0b0;
    border-radius: 4px;
    padding: 4px 6px;
    font: inherit;
    font-size: 12px;
    background: #fff;
  }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 11px; line-height: 1.25; }
  #list { overflow: auto; flex: 1; }
  .thana {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    border-bottom: 1px solid #eee;
    background: #fff;
    padding: 4px 8px;
    cursor: pointer;
    font: inherit;
  }
  .thana:hover { background: #f2f7fc; }
  .thana.on { background: #deebf7; box-shadow: inset 3px 0 0 var(--navy); }
  .thana .name { font-weight: 700; color: var(--navy); font-size: 12.5px; line-height: 1.2; }
  .thana .meta { color: var(--muted); font-size: 10.5px; line-height: 1.2; }
  main { grid-row: 2; min-width: 0; overflow: auto; padding-bottom: 16px; }
  .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 10px 16px 4px; }
  .head h2 { margin: 0; font-size: 19px; color: var(--navy); }
  .nav { display: flex; gap: 6px; }
  .nav button {
    border: 1px solid #b0b0b0;
    background: #fff;
    border-radius: 12px;
    padding: 4px 12px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .nav button:disabled { opacity: .4; cursor: default; }
  .kpis { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 16px 8px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; min-width: 92px; }
  .kpi b { display: block; font-size: 13px; line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: 10px; line-height: 1.2; white-space: nowrap; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #c8c8c8; position: relative; height: 380px; min-width: 0; }
  .card canvas { width: 100%; height: 100%; display: block; }
  .tip {
    position: absolute; display: none; pointer-events: none; z-index: 2;
    background: #fff; border: 1px solid #b0b0b0; border-radius: 4px;
    padding: 5px 8px; font-size: 12px; line-height: 1.35; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    white-space: nowrap;
  }
  .note { padding: 6px 16px 0; color: var(--muted); font-size: 11.5px; }
  .report { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 12px; padding: 12px 16px 0; align-items: start; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .panel h3 { margin: 0; padding: 4px 8px; color: #fff; font-size: 12px; background: var(--navy); }
  .panel.sites h3 { background: var(--teal); }
  .scroll { max-height: 420px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 3px 7px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; }
  td.site-name { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; top: 0; background: #f2f2f2; color: #333; font-weight: 700; z-index: 1; white-space: normal; vertical-align: bottom; line-height: 1.15; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 700; background: #fafafa; border-top: 1px solid var(--line); }
  tr.off td { color: #8c8c8c; }
  tbody tr.hl td { background: #fff2cc; }
  .empty { padding: 40px 16px; color: var(--muted); }
  @media (max-width: 1100px) {
    .report { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 38vh minmax(0, 1fr); height: auto; min-height: 100vh; }
    aside { grid-row: 2; border-right: 0; border-bottom: 1px solid var(--line); }
    main { grid-row: 3; overflow: visible; }
    .charts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>Robi Live Site · On Air Year dashboard</h1>
  <span id="source"></span>
</div>
<aside>
  <div class="tools">
    <label for="district">District</label>
    <select id="district"></select>
    <label for="q">Thana</label>
    <input id="q" type="search" placeholder="Search thana" autocomplete="off">
    <p class="sub" id="listInfo"></p>
  </div>
  <div id="list"></div>
</aside>
<main>
  <div class="head">
    <div>
      <h2 id="title">Select a thana</h2>
      <p class="sub" id="caption"></p>
    </div>
    <div class="nav">
      <button id="prev" type="button">Previous</button>
      <button id="next" type="button">Next</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="charts">
    <div class="card"><canvas id="voiceChart"></canvas><div class="tip" id="voiceTip"></div></div>
    <div class="card"><canvas id="dataChart"></canvas><div class="tip" id="dataTip"></div></div>
  </div>
  <p class="note" id="note"></p>
  <div class="report">
    <section class="panel">
      <h3>By On Air Year</h3>
      <div class="scroll"><table id="yearTable"></table></div>
    </section>
    <section class="panel sites">
      <h3 id="siteHead">Sites</h3>
      <div class="scroll" id="siteScroll"><table id="siteTable"></table></div>
    </section>
  </div>
</main>
<script>
const VIEW = __DATA__;
const CODE = 0, NAME = 1, YEAR = 2, DATE = 3, STATUS = 4, TYPE = 5, VOICE = 6, DATA4G = 7;
const LINE = "#156082";
const CHARTS = [
  { id: "voiceChart", tip: "voiceTip", col: VOICE, title: "Total voice(Erl) vs On Air Year", yTitle: "Total voice, Erl", unit: "Erl", label: "Total voice" },
  { id: "dataChart", tip: "dataTip", col: DATA4G, title: "DAILY 4G DATA (GB) vs  On Air Year", yTitle: "DAILY 4G DATA (GB)", unit: "GB", label: "DAILY 4G DATA" }
];
let districtIndex = 0;
let thanaIndex = 0;
let query = "";
let hover = -1;

const fmt = (value, digits) => typeof value === "number"
  ? value.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits })
  : (value == null || value === "" ? "—" : String(value));
const esc = text => String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const yearLabel = year => year == null ? "—" : "Y " + year;

function district() { return VIEW.districts[districtIndex]; }
function thana() { return district().thanas[thanaIndex]; }
function charted(t) { return t.sites.slice(0, t.charted); }
function shownThanas() {
  const q = query.trim().toLowerCase();
  return district().thanas.map((t, i) => ({ t, i })).filter(({ t }) => !q || t.name.toLowerCase().includes(q));
}

function niceStep(max) {
  if (!(max > 0)) return 1;
  const raw = max / 5;
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / power;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * power;
}

function monotone(ctx, xs, ys) {
  const n = xs.length;
  ctx.moveTo(xs[0], ys[0]);
  if (n === 2) { ctx.lineTo(xs[1], ys[1]); return; }
  const dx = [], m = [], t = new Array(n);
  for (let i = 0; i < n - 1; i++) { dx[i] = xs[i + 1] - xs[i]; m[i] = (ys[i + 1] - ys[i]) / dx[i]; }
  t[0] = m[0];
  t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    ctx.bezierCurveTo(xs[i] + h, ys[i] + t[i] * h, xs[i + 1] - h, ys[i + 1] - t[i + 1] * h, xs[i + 1], ys[i + 1]);
  }
}

function drawChart(spec) {
  const canvas = document.getElementById(spec.id);
  const box = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const width = box.clientWidth, height = box.clientHeight;
  canvas.width = Math.max(1, Math.floor(width * dpr));
  canvas.height = Math.max(1, Math.floor(height * dpr));
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);

  const points = charted(thana());
  const values = points.map(site => site[spec.col]);
  const pad = { l: 72, r: 18, t: 46, b: 84 };
  const plotW = width - pad.l - pad.r, plotH = height - pad.t - pad.b;
  const peak = values.length ? Math.max(...values) : 0;
  const step = niceStep(peak * 1.05);
  const yMax = Math.max(step, Math.ceil((peak * 1.05) / step) * step);
  const digits = step < 1 ? 2 : 1;
  const n = points.length;
  const xAt = i => pad.l + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const yAt = v => pad.t + plotH - (v / yMax) * plotH;

  ctx.fillStyle = "#595959";
  ctx.font = "bold 17px Calibri, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.fillText(spec.title, width / 2, 12);

  ctx.font = "12px Calibri, sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.lineWidth = 1;
  for (let v = 0; v <= yMax + step / 1000; v += step) {
    const y = Math.round(yAt(v)) + 0.5;
    ctx.strokeStyle = "#d9d9d9";
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(width - pad.r, y); ctx.stroke();
    ctx.fillText(fmt(v, digits).replace(/,/g, ""), pad.l - 8, y);
  }
  ctx.save();
  ctx.translate(16, pad.t + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center";
  ctx.font = "13px Calibri, sans-serif";
  ctx.fillText(spec.yTitle, 0, 0);
  ctx.restore();

  const axisY = pad.t + plotH;
  ctx.strokeStyle = "#b0b0b0";
  ctx.beginPath(); ctx.moveTo(pad.l, axisY + 0.5); ctx.lineTo(width - pad.r, axisY + 0.5); ctx.stroke();

  if (n) {
    const spacing = n <= 1 ? plotW : plotW / (n - 1);
    const stride = Math.max(1, Math.ceil(13 / spacing));
    ctx.font = "11.5px Calibri, sans-serif";
    ctx.fillStyle = "#595959";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let i = 0; i < n; i += stride) {
      ctx.save();
      ctx.translate(xAt(i), axisY + 6);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(yearLabel(points[i][YEAR]), 0, 0);
      ctx.restore();
    }
  }
  ctx.font = "13px Calibri, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.fillText("On Air Year", pad.l + plotW / 2, height - 8);

  if (!n) {
    ctx.textBaseline = "middle";
    ctx.fillText("No site with an On Air Year and a value in this thana", pad.l + plotW / 2, pad.t + plotH / 2);
    canvas._geom = null;
    return;
  }
  const xs = points.map((_, i) => xAt(i)), ys = values.map(yAt);
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  if (n > 1) { ctx.beginPath(); monotone(ctx, xs, ys); ctx.stroke(); }
  if (n <= 25) {
    ctx.fillStyle = LINE;
    xs.forEach((x, i) => { ctx.beginPath(); ctx.arc(x, ys[i], 3.2, 0, Math.PI * 2); ctx.fill(); });
  }
  if (hover >= 0 && hover < n) {
    ctx.strokeStyle = "rgba(0,0,0,.25)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(xs[hover], pad.t); ctx.lineTo(xs[hover], axisY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#C00000";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(xs[hover], ys[hover], 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  canvas._geom = { pad, plotW, plotH, n, xs, ys };
}

function drawAll() { CHARTS.forEach(drawChart); }

function showTips() {
  const points = charted(thana());
  CHARTS.forEach(spec => {
    const tip = document.getElementById(spec.tip);
    const geom = document.getElementById(spec.id)._geom;
    if (hover < 0 || !geom || hover >= points.length) { tip.style.display = "none"; return; }
    const site = points[hover];
    tip.innerHTML = `<b>${hover + 1}. ${esc(site[CODE])}</b> · ${yearLabel(site[YEAR])}<br>` +
      `On Air Date ${esc(site[DATE] || "—")}<br>` +
      `<span style="color:${LINE}">${spec.label}: <b>${fmt(site[spec.col], 2)} ${spec.unit}</b></span>`;
    tip.style.display = "block";
    const box = tip.parentElement.getBoundingClientRect();
    const tipW = tip.offsetWidth, tipH = tip.offsetHeight;
    let left = geom.xs[hover] + 12;
    if (left + tipW > box.width - 6) left = geom.xs[hover] - tipW - 12;
    let top = geom.ys[hover] - tipH - 10;
    if (top < 4) top = geom.ys[hover] + 12;
    tip.style.left = Math.max(4, left) + "px";
    tip.style.top = Math.max(4, top) + "px";
  });
  document.querySelectorAll("#siteTable tbody tr").forEach(tr => tr.classList.toggle("hl", Number(tr.dataset.i) === hover));
}

function setHover(index) {
  if (index === hover) return;
  hover = index;
  drawAll();
  showTips();
}

function onMove(event) {
  const canvas = event.currentTarget;
  const geom = canvas._geom;
  if (!geom) return;
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left, y = event.clientY - rect.top;
  if (x < geom.pad.l - 10 || x > geom.pad.l + geom.plotW + 10 || y < geom.pad.t - 10 || y > geom.pad.t + geom.plotH + 10) {
    setHover(-1);
    return;
  }
  const i = geom.n <= 1 ? 0 : Math.round((x - geom.pad.l) / geom.plotW * (geom.n - 1));
  setHover(Math.max(0, Math.min(geom.n - 1, i)));
}

function kpi(label, value) {
  return `<div class="kpi"><b>${value}</b><span>${label}</span></div>`;
}

function renderReport() {
  const t = thana();
  const points = charted(t);
  const sum = col => points.reduce((acc, site) => acc + site[col], 0);
  const voice = sum(VOICE), data = sum(DATA4G);
  const years = points.map(site => site[YEAR]);
  const first = years.length ? years[0] : null, last = years.length ? years[years.length - 1] : null;
  document.getElementById("title").textContent = t.name;
  document.getElementById("caption").textContent =
    `${district().name} district · ${t.sites.length.toLocaleString()} sites · ${points.length.toLocaleString()} on chart` +
    (years.length ? ` · ${yearLabel(first)} to ${yearLabel(last)}` : "");
  document.getElementById("kpis").innerHTML = [
    kpi("Sites in thana", t.sites.length.toLocaleString()),
    kpi("Sites on chart", points.length.toLocaleString()),
    kpi("Oldest On Air Year", yearLabel(first)),
    kpi("Newest On Air Year", yearLabel(last)),
    kpi("Total voice, sum (Erl)", fmt(voice, 1)),
    kpi("Total voice, avg / site (Erl)", points.length ? fmt(voice / points.length, 1) : "—"),
    kpi("DAILY 4G DATA, sum (GB)", fmt(data, 1)),
    kpi("DAILY 4G DATA, avg / site (GB)", points.length ? fmt(data / points.length, 1) : "—")
  ].join("");
  const off = t.sites.length - points.length;
  document.getElementById("note").textContent =
    "Each point is one site. Sites are sorted by On Air Year, oldest first; within the same year by On Air Date, then Site Code." +
    (off ? ` ${off} site${off === 1 ? " is" : "s are"} not on the chart (no On Air Year, or #N/A value) and ${off === 1 ? "is" : "are"} listed at the bottom of the site table.` : "");

  const byYear = new Map();
  points.forEach(site => {
    const row = byYear.get(site[YEAR]) || { n: 0, voice: 0, data: 0 };
    row.n += 1; row.voice += site[VOICE]; row.data += site[DATA4G];
    byYear.set(site[YEAR], row);
  });
  const yearRows = [...byYear.entries()].map(([year, row]) =>
    `<tr><td>${yearLabel(year)}</td><td class="num">${row.n}</td><td class="num">${fmt(row.voice, 1)}</td><td class="num">${fmt(row.data, 1)}</td></tr>`).join("");
  document.getElementById("yearTable").innerHTML =
    `<thead><tr><th>On Air Year</th><th class="num">Sites</th><th class="num">Total voice (Erl)</th><th class="num">DAILY 4G DATA (GB)</th></tr></thead>` +
    `<tbody>${yearRows}</tbody>` +
    (points.length ? `<tfoot><tr class="total"><td>Total</td><td class="num">${points.length}</td><td class="num">${fmt(voice, 1)}</td><td class="num">${fmt(data, 1)}</td></tr></tfoot>` : "");

  document.getElementById("siteHead").textContent = `Sites in ${t.name} (${t.sites.length})`;
  const siteRows = t.sites.map((site, i) => {
    const on = i < t.charted;
    return `<tr data-i="${on ? i : -1}" class="${on ? "" : "off"}">` +
      `<td class="num">${on ? i + 1 : "—"}</td><td>${esc(site[CODE])}</td><td class="site-name" title="${esc(site[NAME])}">${esc(site[NAME])}</td>` +
      `<td>${yearLabel(site[YEAR])}</td><td>${esc(site[DATE] || "—")}</td><td>${esc(site[STATUS])}</td><td>${esc(site[TYPE])}</td>` +
      `<td class="num">${fmt(site[VOICE], 2)}</td><td class="num">${fmt(site[DATA4G], 2)}</td></tr>`;
  }).join("");
  document.getElementById("siteTable").innerHTML =
    `<thead><tr><th class="num">No.</th><th>Site Code</th><th>Site Name</th><th>On Air Year</th><th>On Air Date</th>` +
    `<th>Site Status</th><th>Site Type</th><th class="num">Total voice (Erl)</th><th class="num">DAILY 4G DATA (GB)</th></tr></thead>` +
    `<tbody>${siteRows}</tbody>`;
  document.getElementById("siteScroll").scrollTop = 0;
}

function renderList() {
  const rows = shownThanas();
  const d = district();
  const siteCount = d.thanas.reduce((acc, t) => acc + t.sites.length, 0);
  document.getElementById("listInfo").textContent =
    `${d.thanas.length} thanas · ${siteCount.toLocaleString()} sites` + (query.trim() ? ` · ${rows.length} match` : "");
  document.getElementById("list").innerHTML = rows.length ? rows.map(({ t, i }) => {
    const years = charted(t).map(site => site[YEAR]);
    const span = years.length ? ` · ${yearLabel(years[0])} to ${yearLabel(years[years.length - 1])}` : "";
    return `<button type="button" class="thana ${i === thanaIndex ? "on" : ""}" data-i="${i}">` +
      `<div class="name">${i + 1}. ${esc(t.name)}</div><div class="meta">${t.sites.length} site${t.sites.length === 1 ? "" : "s"}${span}</div></button>`;
  }).join("") : '<p class="sub" style="padding:10px 8px">No thana matches.</p>';
  const active = document.querySelector(".thana.on");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function updateNav() {
  const rows = shownThanas();
  const pos = rows.findIndex(row => row.i === thanaIndex);
  document.getElementById("prev").disabled = pos <= 0;
  document.getElementById("next").disabled = pos < 0 || pos >= rows.length - 1;
}

function selectThana(index) {
  thanaIndex = Math.max(0, Math.min(district().thanas.length - 1, index));
  hover = -1;
  renderList();
  renderReport();
  drawAll();
  showTips();
  updateNav();
  try {
    history.replaceState(null, "", "#" + encodeURIComponent(district().name) + "/" + encodeURIComponent(thana().name));
  } catch (err) {}
}

function selectDistrict(index, thanaName) {
  districtIndex = index;
  query = "";
  document.getElementById("q").value = "";
  document.getElementById("district").value = String(index);
  const found = thanaName ? district().thanas.findIndex(t => t.name === thanaName) : -1;
  selectThana(found >= 0 ? found : 0);
}

function step(delta) {
  const rows = shownThanas();
  let pos = rows.findIndex(row => row.i === thanaIndex);
  if (pos < 0) pos = 0;
  pos = Math.max(0, Math.min(rows.length - 1, pos + delta));
  if (rows[pos]) selectThana(rows[pos].i);
}

const totalSites = VIEW.districts.reduce((acc, d) => acc + d.thanas.reduce((a, t) => a + t.sites.length, 0), 0);
const totalThanas = VIEW.districts.reduce((acc, d) => acc + d.thanas.length, 0);
document.getElementById("source").textContent =
  `${VIEW.source} · ${totalSites.toLocaleString()} sites · ${VIEW.districts.length} districts · ${totalThanas} thanas · ${VIEW.version}`;
document.getElementById("district").innerHTML = VIEW.districts.map((d, i) => {
  const n = d.thanas.reduce((acc, t) => acc + t.sites.length, 0);
  return `<option value="${i}">${esc(d.name)} (${n.toLocaleString()} sites)</option>`;
}).join("");
document.getElementById("district").addEventListener("change", event => selectDistrict(Number(event.target.value)));
document.getElementById("q").addEventListener("input", event => {
  query = event.target.value;
  renderList();
  updateNav();
});
document.getElementById("q").addEventListener("keydown", event => {
  if (event.key !== "Enter") return;
  const rows = shownThanas();
  if (rows.length) selectThana(rows[0].i);
});
document.getElementById("list").addEventListener("click", event => {
  const button = event.target.closest(".thana");
  if (button) selectThana(Number(button.dataset.i));
});
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
CHARTS.forEach(spec => {
  const canvas = document.getElementById(spec.id);
  canvas.addEventListener("mousemove", onMove);
  canvas.addEventListener("mouseleave", () => setHover(-1));
});
document.getElementById("siteTable").addEventListener("mouseover", event => {
  const tr = event.target.closest("tbody tr");
  if (tr && Number(tr.dataset.i) >= 0) setHover(Number(tr.dataset.i));
});
document.getElementById("siteTable").addEventListener("mouseleave", () => setHover(-1));
window.addEventListener("resize", drawAll);

(function start() {
  const raw = (location.hash || "").replace(/^#/, "");
  const cut = raw.indexOf("/");
  const dName = decodeURIComponent(cut >= 0 ? raw.slice(0, cut) : raw);
  const tName = cut >= 0 ? decodeURIComponent(raw.slice(cut + 1)) : "";
  const found = VIEW.districts.findIndex(d => d.name === dName);
  selectDistrict(found >= 0 ? found : 0, tName);
})();
</script>
</body>
</html>
